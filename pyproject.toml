[project]
name = "bd-search-mcp"
version = "0.1.0"
description = "MCP server: Exa / Brave / Parallel search, every call from a new Bright Data exit IP"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ARG"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "ARG001", "ARG005"]
